[project]
name = "cascade-personal-ai"
version = "0.3.0"
description = "Deterministic consequence propagation for personal commitments"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "networkx>=3.4,<4", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
cascade-demo = "cascade.demo:main"
cascade-reason = "cascade.reasoning.cli:main"
cascade-eval = "cascade.evals.harness:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cascade", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
